# /etc/nginx/sites-available/portfolio
# Copy this to each EC2 instance

server {
    listen 80;
    server_name _;

    # ── Health check endpoint (required by AWS ALB) ──────────────
    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # ── Serve React static build ──────────────────────────────────
    root /var/www/portfolio/build;
    index index.html index.htm;

    location / {
        try_files $uri $uri/ /index.html;

        # Gzip compression
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_proxied any;
        gzip_types
            text/plain
            text/css
            text/javascript
            application/javascript
            application/json
            application/xml
            image/svg+xml;
    }

    # ── Cache static assets aggressively ─────────────────────────
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Security headers ──────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"                    always;
    add_header X-Content-Type-Options "nosniff"                       always;
    add_header X-XSS-Protection       "1; mode=block"                 always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # ── Show which instance served the request (demo purposes) ───
    add_header X-Served-By $hostname always;
    add_header X-Instance-AZ "us-east-1a" always;  # Change to 1b on instance 2

    # ── Logging ──────────────────────────────────────────────────
    access_log /var/log/nginx/portfolio_access.log;
    error_log  /var/log/nginx/portfolio_error.log;
}
